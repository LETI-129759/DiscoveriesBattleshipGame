name: Notify the author of Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  notify-author:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar o autor no Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            // Gets the author of the PR username
            const author = context.payload.pull_request.user.login;
            
            // Mensagem de notificação/menção ao autor
            const body = `Olá @${author}, o teu Pull Request foi recebido com sucesso e a execução do workflow foi iniciada.`;
            
            // Creates a comment on the PR mencioning the author
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
